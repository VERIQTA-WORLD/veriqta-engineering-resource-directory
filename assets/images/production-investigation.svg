<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc"><title id="title">INVESTIGATE WITH EVIDENCE</title><desc id="desc">Use operational references to guide a verified investigation.</desc><rect width="1600" height="590" fill="#081827"/><path d="M0 0H1600" stroke="#51e0b4" stroke-width="10"/><circle cx="1480" cy="40" r="240" fill="#13354b"/><g font-family="Arial,sans-serif" font-weight="700"><text x="80" y="75" font-size="24" fill="#51e0b4">VERIQTA WORLD</text><text x="80" y="170" font-size="58" fill="#f1f7fd">INVESTIGATE WITH EVIDENCE</text><text x="80" y="235" font-size="24" fill="#adc4d8">Use operational references to guide a verified investigation.</text><rect x="80" y="290" width="340" height="135" rx="18" fill="#123047" stroke="#315167"/><text x="100" y="335" font-size="25" fill="#51e0b4">Scope</text><text x="100" y="378" font-size="18" fill="#d9e7f2">Impact and symptoms</text><rect x="445" y="290" width="340" height="135" rx="18" fill="#123047" stroke="#315167"/><text x="465" y="335" font-size="25" fill="#51e0b4">Evidence</text><text x="465" y="378" font-size="18" fill="#d9e7f2">Signals and changes</text><rect x="810" y="290" width="340" height="135" rx="18" fill="#123047" stroke="#315167"/><text x="830" y="335" font-size="25" fill="#51e0b4">Hypotheses</text><text x="830" y="378" font-size="18" fill="#d9e7f2">Check competing causes</text><rect x="1175" y="290" width="340" height="135" rx="18" fill="#123047" stroke="#315167"/><text x="1195" y="335" font-size="25" fill="#51e0b4">Recovery</text><text x="1195" y="378" font-size="18" fill="#d9e7f2">Verify the outcome</text><text x="80" y="545" font-size="18" fill="#86a3ba">Explore. Understand. Practise. Apply.</text></g></svg>