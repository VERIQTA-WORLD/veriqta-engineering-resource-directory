<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-labelledby="title"><title id="title">Name resolution, connection, encryption, and application checks</title><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="998" height="138" rx="12" fill="#FAF7EF" stroke="#D9E1D7"/><text x="21" y="56" font-size="24" fill="#103E34" font-weight="700">Name</text><text x="21" y="91" font-size="16" fill="#587068">Which address?</text><path d="M227 66H251M244 59L251 66L244 73" fill="none" stroke="#286150" stroke-width="2"/><text x="270" y="56" font-size="24" fill="#103E34" font-weight="700">Connection</text><text x="270" y="91" font-size="16" fill="#587068">Can you reach it?</text><path d="M476 66H500M493 59L500 66L493 73" fill="none" stroke="#286150" stroke-width="2"/><text x="519" y="56" font-size="24" fill="#103E34" font-weight="700">TLS, if used</text><text x="519" y="91" font-size="16" fill="#587068">Can peers negotiate?</text><path d="M725 66H749M742 59L749 66L742 73" fill="none" stroke="#286150" stroke-width="2"/><text x="768" y="56" font-size="24" fill="#103E34" font-weight="700">Application</text><text x="768" y="91" font-size="16" fill="#587068">Does the request work?</text></g></svg>